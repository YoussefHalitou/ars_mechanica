# Industry Template: General (Allgemein)
# Default template for any craft business

industry:
  id: general
  name: Handwerksbetrieb
  icon: building
  description: Allgemeiner Handwerksbetrieb

enabled_modules:
  - projects
  - employees
  - time_pairs
  - materials
  - services
  - morningplan
  - users
  - feedback
  - material_usage
  - inspections
  - revenue
  - analytics

terminology:
  project: "Projekt"
  projects: "Projekte"
  inspection: "Besichtigung"
  employee: "Mitarbeiter"
  vehicle: "Fahrzeug"
  material: "Material"
  service: "Dienstleistung"
  time_pair: "Zeiterfassung"
  morningplan: "Tagesplan"

default_services:
  - name: "Arbeitsstunde"
    category: "Arbeitszeit"
    unit: "Stunde"
  - name: "Anfahrt"
    category: "Anfahrt"
    unit: "km"
  - name: "Beratung"
    category: "Service"
    unit: "Stunde"
  - name: "Montage"
    category: "Montage"
    unit: "Pauschal"
  - name: "Reparatur"
    category: "Service"
    unit: "Stunde"

default_materials:
  - name: "Kleinmaterial"
    category: "Verbrauch"
    unit: "Pauschal"

