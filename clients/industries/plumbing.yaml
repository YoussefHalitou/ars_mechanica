  - name: "Kupferrohr 15mm"
    category: "Rohre"
    unit: "Meter"
  - name: "Kupferrohr 22mm"
    category: "Rohre"
    unit: "Meter"
  - name: "Verbundrohr 16mm"
    category: "Rohre"
    unit: "Meter"
  - name: "Fitting 15mm"
    category: "Fittings"
