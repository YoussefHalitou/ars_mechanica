# Industry Template: Plumbing & Heating (Sanitär & Heizung)

industry:
  id: plumbing
  name: Sanitär & Heizung
  icon: wrench
  description: Sanitär-, Heizungs- und Klimatechnik

enabled_modules:
  - projects
  - employees
  - time_pairs
  - materials
  - services
  - morningplan
  - users
  - feedback
  - material_usage   # Track material consumption
  - inspections      # Site inspections
  - revenue
  - analytics

terminology:
  project: "Auftrag"
  projects: "Aufträge"
  inspection: "Vor-Ort-Termin"
  employee: "Monteur"
  vehicle: "Servicefahrzeug"
  material: "Material"
  service: "Leistung"
  time_pair: "Arbeitsstunden"
  morningplan: "Tagesplan"

default_services:
  - name: "Monteurstunde"
    category: "Arbeitszeit"
    unit: "Stunde"
  - name: "Heizungsinstallation"
    category: "Heizung"
    unit: "Pauschal"
  - name: "Sanitärinstallation"
    category: "Sanitär"
    unit: "Pauschal"
  - name: "Wartung Heizung"
    category: "Wartung"
    unit: "Pauschal"
  - name: "Notdienst"
    category: "Service"
    unit: "Stunde"
  - name: "Rohrbruch-Reparatur"
    category: "Reparatur"
    unit: "Pauschal"
  - name: "WC-Installation"
    category: "Sanitär"
    unit: "Stück"
  - name: "Therme-Wartung"
    category: "Wartung"
