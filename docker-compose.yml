version: '3.8'

services:
  # PostgreSQL for local development (REQUIRED - no external Supabase)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lis_dev
      - TENANT=${TENANT:-demo}
      - REDIS_URL=redis://redis:6379
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8501
      - SECRET_KEY=${SECRET_KEY:-ars-mechanica-dev-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - ./backend:/app/backend
      - ./clients:/app/clients
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - TENANT=${TENANT:-demo}
    volumes:
      - ./streamlit_app:/app/streamlit_app
      - ./backend:/app/backend
      - ./clients:/app/clients
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Production backend (without volume mounts)
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lis_dev
      - TENANT=${TENANT:-demo}
      - REDIS_URL=redis://redis:6379
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production streamlit (without volume mounts)
  streamlit-prod:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "3000:8501"
    environment:
      - API_URL=http://backend-prod:8000
      - TENANT=${TENANT:-demo}
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Marketing Website (Next.js)
  marketing:
    build:
      context: .
      dockerfile: Dockerfile.marketing
    ports:
      - "3001:3001"
    environment:
      - API_URL=http://backend:8000
      - APP_URL=http://localhost:8501
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: lis_network
